name: Build DropSort

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --windowed --onedir --name DropSort --icon assets/dropsort.icns --osx-bundle-identifier com.keizett.dropsort main.py
      - name: Create DMG
        shell: bash
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R "dist/DropSort.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "DropSort" -srcfolder dmg-root -ov -format UDZO "DropSort-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: DropSort-macOS
          path: DropSort-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --windowed --onedir --name DropSort --icon assets\dropsort.ico main.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: cmd
        run: iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: DropSort-Windows
          path: installer-output/DropSort-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            release-assets/DropSort-macOS/DropSort-macOS.dmg
            release-assets/DropSort-Windows/DropSort-Setup.exe

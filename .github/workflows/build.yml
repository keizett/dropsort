```yaml
name: Build DropSort

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt pyinstaller

      - run: python -m PyInstaller --windowed --onedir --name DropSort --icon assets/dropsort.icns --osx-bundle-identifier com.keizett.dropsort main.py

      - name: Create DMG
        shell: bash
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R "dist/DropSort.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "DropSort" -srcfolder dmg-root -ov -format UDZO "DropSort-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: DropSort-macOS
          path: DropSort-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt pyinstaller

      - run: python -m PyInstaller --windowed --onedir --name DropSort --icon assets\dropsort.ico main.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: cmd
        run: iscc installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DropSort-Windows
          path: installer-output/DropSort-Setup.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libegl1 \
            libgl1

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build Linux application
        run: python -m PyInstaller --windowed --onedir --name DropSort main.py

      - name: Package Linux application
        run: |
          tar -czf DropSort-Linux.tar.gz -C dist DropSort

      - uses: actions/upload-artifact@v4
        with:
          name: DropSort-Linux
          path: DropSort-Linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            release-assets/DropSort-macOS/DropSort-macOS.dmg
            release-assets/DropSort-Windows/DropSort-Setup.exe
            release-assets/DropSort-Linux/DropSort-Linux.tar.gz
```

name: Build DropSort

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --windowed --onedir --name DropSort main.py
      - run: ditto -c -k --sequesterRsrc --keepParent "dist/DropSort.app" "DropSort-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DropSort-macOS
          path: DropSort-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --windowed --onedir --name DropSort main.py
      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path "dist/DropSort" -DestinationPath "DropSort-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DropSort-Windows
          path: DropSort-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/DropSort-macOS/DropSort-macOS.zip
            release-assets/DropSort-Windows/DropSort-Windows.zip
